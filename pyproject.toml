[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "env-guard"
version = "0.1.0"
description = "Validate .env files against .env.example, detect leaked secrets, and generate safe templates."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "env-guard contributors" },
]
keywords = ["dotenv", "env", "security", "secrets", "cli", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
env-guard = "env_guard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/env_guard"]
